name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04-arm covers Linux users running this on ARM SBCs (Raspberry Pi and
        # similar) — a real audience for a tool that talks to hardware over serial.
        platform: [windows-latest, macos-latest, ubuntu-22.04, ubuntu-22.04-arm]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux backend (webkit2gtk, appindicator, dbus, ...) needs system libraries that
      # aren't preinstalled on the Ubuntu runner image. Matches both the x64 and arm64 runners.
      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-22.04')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm exec tsc --noEmit

      - name: Build frontend
        run: pnpm build

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
