name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Runs once, before the matrix build below. tauri-action can create-or-find a release by tag
  # name on its own, but that lookup isn't atomic: with four matrix jobs (windows/macos/linux
  # x64/linux arm64) all starting at once and each independently checking "does a release for
  # this tag exist yet", more than one of them can see "no" before any of the others has
  # finished creating one, so each of the racing jobs creates its own separate draft release for
  # the same tag — exactly what happened for v0.1.3, split into a Windows-only draft and a
  # macOS+Linux draft. Creating the (single) release here, once, up front, and having every
  # matrix job upload into that specific release by ID instead, removes the race entirely.
  create-release:
    name: Create draft release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = context.ref.replace("refs/tags/", "");
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `pnfc-toolkit ${tagName}`,
              draft: true,
              prerelease: false,
            });
            return data.id;

  release:
    name: Build (${{ matrix.platform }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # Universal binary (Apple Silicon + Intel) in one .dmg.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          # Covers Linux users running this on ARM SBCs (Raspberry Pi and similar) — a real
          # audience for a tool that talks to hardware over serial.
          - platform: ubuntu-22.04-arm
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-22.04')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libudev-dev \
            xdg-utils \
            pkg-config

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Builds the app and uploads the installers as assets on the **draft** release
      # `create-release` made above (identified by ID, not by tag name — see that job's comment
      # for why) — it never gets published automatically, a maintainer still has to review it
      # and hit "Publish" by hand.
      - name: Build the app and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # "Portable" build for people who don't want to install anything: the app is a single
      # self-contained .exe (WebView2Loader is statically linked, and there's no
      # `bundle.resources` in tauri.conf.json for it to depend on), confirmed by launching it
      # from an empty directory with nothing else next to it — so the zip only needs to contain
      # that one file, nothing more.
      - name: Package portable build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $zipName = "pnfc-toolkit_${version}_x64_portable.zip"
          Compress-Archive -Path "src-tauri/target/release/pnfc-toolkit.exe" -DestinationPath $zipName
          echo "PORTABLE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: Upload portable build to the release
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$env:PORTABLE_ZIP" --clobber
        shell: pwsh
